[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sep-python-sdk"
dynamic = ["version"]
description = "Unofficial, fully typed Python SDK for the Saman Electronic Payment (SEP) online payment gateway: token, redirect, callback, verify and reverse."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mojtaba Sohrabi" }]
keywords = [
    "saman",
    "sep",
    "samanepay",
    "shaparak",
    "payment",
    "payment-gateway",
    "ipg",
    "iran",
    "sdk",
    "httpx",
    "asyncio",
    "typed",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/mojtabasohrabi/sep-python-sdk"
Documentation = "https://github.com/mojtabasohrabi/sep-python-sdk#readme"
Source = "https://github.com/mojtabasohrabi/sep-python-sdk"
Issues = "https://github.com/mojtabasohrabi/sep-python-sdk/issues"
Changelog = "https://github.com/mojtabasohrabi/sep-python-sdk/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "sep_sdk._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sep_sdk = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RET", "PL", "RUF", "N", "A", "PT", "T20"]
ignore = [
    "PLR0913",  # an SDK request object has many optional keyword arguments by design
    "PLR2004",  # protocol constants in tests and validators are clearer inline
    "RUF001",   # Persian text legitimately contains look-alike characters
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# "token" is a payment token / URL path here, not a password.
"src/sep_sdk/constants.py" = ["S105"]
"src/sep_sdk/enums.py" = ["S105"]
"tests/*" = ["S101", "S105", "S106", "PLR0915", "T20"]
"examples/*" = ["S104", "S105", "T20", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["sep_sdk"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --cov=sep_sdk --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["sep_sdk"]
